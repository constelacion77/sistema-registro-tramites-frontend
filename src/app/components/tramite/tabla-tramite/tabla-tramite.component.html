<table class="table table-striped">
    <thead class="table-dark">
        <tr>
            <th>Documento</th>
            <th>Beneficiario</th>
            @if(authService.esAdmin()) {
            <th>Folio</th>
            <th>Acciones</th>
            }
        </tr>
    </thead>
    <tbody class="table-light">
        @for(tra of tramites(); track tra.id) {
            <tr>
                <th>{{tra.idDocumento.nombre}}</th>
                <th>{{tra.idBeneficiario.nombre}} {{tra.idBeneficiario.apellidos}}</th>
                @if(authService.esAdmin()) {
                <th>{{tra.folio}}</th>
                <th>
                    <div class="d-grid d-md-flex justify-content-start gap-2">
                        <button type="button" (click)="editarTramite(tra.id)"
                        class="btn btn-outline-primary"><i class="bi bi-pencil"></i></button>
                        <button type="button" data-bs-toggle="modal" data-bs-target="#confirmDialog" (click)="idTramite.set(tra.id)"
                        class="btn btn-outline-danger"><i class="bi bi-trash"></i></button>
                    </div>
                </th>
                }
            </tr>
        }@empty{
            <tr>
                <td class="text-center" colspan="4">
                    No hay tramites para mostrar.
                </td>
            </tr>
        }
    </tbody>
</table>
<confirm-dialog
    [titulo]="'Eliminar'"
    [mensaje]="'¿Estás seguro de eliminar este Tramite?'"
    (confirmation)="eliminarTramite()"
></confirm-dialog>
